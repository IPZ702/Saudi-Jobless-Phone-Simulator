<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>الساعة العالمية</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            font-family: -apple-system, 'IBM Plex Sans Arabic', sans-serif;
            height: 100%;
            background: #000;
            color: white;
            overflow: hidden;
        }

        .clock-app {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        /* Header */
        .header {
            padding: 45px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border-bottom: 0.5px solid #2c2c2e;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-btn {
            background: none;
            border: none;
            color: #ff9f0a;
            font-size: 26px;
            cursor: pointer;
            font-weight: 300;
        }

        /* World Clock Content */
        .world-clock-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .world-clock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 0.5px solid #2c2c2e;
        }

        .city-info .city-diff {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 3px;
        }

        .city-info .city-name {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .city-time {
            font-size: 46px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>
    <div class="clock-app">
        <div class="header">
            <button class="header-btn">+</button>
            <h1>الساعة العالمية</h1>
        </div>

        <div class="world-clock-container">
            <div class="world-clock-item">
                <div class="city-info">
                    <div class="city-diff">المملكة العربية السعودية</div>
                    <div class="city-name">الرياض</div>
                </div>
                <div class="city-time" id="riyadh-time">00:00</div>
            </div>
            
            <div class="world-clock-item">
                <div class="city-info">
                    <div class="city-diff">العاصمة المقدسة</div>
                    <div class="city-name">مكة المكرمة</div>
                </div>
                <div class="city-time" id="makkah-time">00:00</div>
            </div>
            
            </div>
        </div>
    </div>

    <script>
        // تحديث أوقات المدن تلقائياً
        function updateWorldClocks() {
            const now = new Date();
            const riyadhTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Riyadh' }));
            const makkahTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Riyadh' }));
            const dubaiTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Dubai' }));
            const cairoTime = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));

            const format = (d) => d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

            document.getElementById('riyadh-time').textContent = format(riyadhTime);
            document.getElementById('makkah-time').textContent = format(makkahTime);
            document.getElementById('dubai-time').textContent = format(dubaiTime);
            document.getElementById('cairo-time').textContent = format(cairoTime);
        }
        
        setInterval(updateWorldClocks, 1000);
        updateWorldClocks();
    </script>
</body>
</html>
